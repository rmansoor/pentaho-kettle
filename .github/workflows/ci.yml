# Builds and tests only the Maven modules a PR touches (plus what they depend on).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MIRROR_URL: ${{ vars.MAVEN_MIRROR_URL || 'https://repo.pentaho.com/artifactory/pnt-mvn/' }}
  MAVEN_OPTS: -Xmx3g

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "11", cache: maven }
      - name: Work out touched modules
        id: mods
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODS=$(bash .github/scripts/changed-modules.sh "origin/$BASE_REF" HEAD)
          else
            MODS="core,engine"
          fi
          echo "modules=$MODS" >> "$GITHUB_OUTPUT"
          echo "Touched modules: ${MODS:-none}"
      - name: Checkstyle
        if: steps.mods.outputs.modules != ''
        run: mvn -B -s .github/maven-settings.xml -pl "${{ steps.mods.outputs.modules }}" checkstyle:check
      - name: Build and unit test
        if: steps.mods.outputs.modules != ''
        run: mvn -B -s .github/maven-settings.xml -pl "${{ steps.mods.outputs.modules }}" -am install
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.txt"
          if-no-files-found: ignore
