# PowerMock must not re-load JDK XML/JMX classes in its class loader: on Java 17+
# they can't reach java.xml / java.management internals from there.
powermock.global-ignore=javax.xml.*,org.xml.*,org.w3c.*,com.sun.org.apache.*,jdk.xml.internal.*,javax.management.*,com.sun.jmx.*,javax.imageio.*,sun.awt.*
